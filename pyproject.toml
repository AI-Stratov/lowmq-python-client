[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lowmq-client"
version = "1.1.0"
description = "Python asynchronous client for interacting with LowMQ"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI-Stratov" }]
license = "MIT"
keywords = ["lowmq", "message-queue", "asyncio", "aiohttp", "client", "pydantic"]
dependencies = [
  "aiohttp>=3.10.11",
  "pydantic>=2.10",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Operating System :: OS Independent",
  "Framework :: AsyncIO",
]

[project.urls]
Homepage = "https://github.com/AI-Stratov/lowmq-python-client"
Repository = "https://github.com/AI-Stratov/lowmq-python-client"
Issues = "https://github.com/AI-Stratov/lowmq-python-client/issues"
"LowMQ Server" = "https://github.com/farawayCC/lowmq"

[tool.setuptools.packages.find]
include = ["lowmq_client*"]

[tool.setuptools.package-data]
lowmq_client = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["lowmq_client"]

[tool.mypy]
python_version = "3.10"
files = ["lowmq_client", "tests"]
strict = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["lowmq_client"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100

[dependency-groups]
dev = [
  "coverage[toml]>=7.16",
  "mypy>=2.4",
  "pre-commit>=4.6",
  "ruff>=0.17",
]
